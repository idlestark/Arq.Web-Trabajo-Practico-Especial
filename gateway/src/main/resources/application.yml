server:
  port: 8009

spring:
  application:
    name: gateway

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/auth?createDatabaseIfNotExist=true
    username: root
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect

  main:
    allow-bean-definition-overriding: true

  cloud:
    gateway:
      mvc:
        routes:
          - id: user-service-users
            uri: http://localhost:8006
            predicates:
              - Path=/user/**
          - id: user-service-accounts
            uri: http://localhost:8006
            predicates:
              - Path=/account/**
          - id: scooter-service-scooters
            uri: http://localhost:8002
            predicates:
              - Path=/scooter/**
          - id: scooter-service-stops
            uri: http://localhost:8002
            predicates:
              - Path=/stop/**
          - id: ticket-service-tickets
            uri: http://localhost:8008
            predicates:
              - Path=/ticket/**
          - id: ticket-service-details
            uri: http://localhost:8008
            predicates:
              - Path=/ticket-details/**
          - id: ticket-service-fees
            uri: http://localhost:8008
            predicates:
              - Path=/fee/**
          - id: admin-service-admin
            uri: http://localhost:8003
            predicates:
              - Path=/admin/**
          - id: admin-service-maintenance
            uri: http://localhost:8003
            predicates:
              - Path=/maintenance/**
          - id: trip-service-trips
            uri: http://localhost:8005
            predicates:
              - Path=/trip/**
          - id: trip-service-pauses
            uri: http://localhost:8005
            predicates:
              - Path=/pause/**

logging:
  level:
    org.springframework.security: DEBUG
    io.jsonwebtoken: DEBUG